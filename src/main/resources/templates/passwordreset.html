    </div>

    <div class="card">
        <div class="card-header">
            <p class="eyebrow">RentHub BD</p>
            <h1>Set a new password</h1>
            <p class="subtitle">Choose something you haven't used before.</p>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/passwordreset}" method="post" novalidate>
            <div class="field">
                <label for="password">New password</label>
                <input type="password" id="password" name="newPassword" required>
                <div class="strength-bar">
                    <span id="strengthSeg1"></span>
                    <span id="strengthSeg2"></span>
                    <span id="strengthSeg3"></span>
                    <span id="strengthSeg4"></span>
                </div>
                <p class="hint" id="strengthLabel">Use 8+ characters with a mix of letters, numbers and symbols</p>
            </div>

            <div class="field">
                <label for="confirmPassword">Retype new password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
                <p class="hint" id="matchLabel"></p>
            </div>

            <button type="submit" class="submit-btn">Reset Password</button>
        </form>
    </div>
</div>
<script th:src="@{/js/register.js}"></script>
</body>
</html>
