<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - RentHubBD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/listing.css}">
    <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>
<body>
<div class="chat-page">
    <div class="chat-shell">

        <header class="chat-header">
            <a th:href="@{${navBack}}" class="chat-back">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <div class="chat-header-info">
                <p class="chat-header-title" th:text="${conversation.property.title}">Property</p>
                <p class="chat-header-sub"
                   th:text="${conversation.renter.id == currentUserId
                              ? 'Chat with ' + conversation.owner.firstName + ' ' + conversation.owner.lastName
                              : 'Chat with ' + conversation.renter.firstName + ' ' + conversation.renter.lastName}">
                    With
                </p>
            </div>
            <a th:href="@{/listing/{id}(id=${conversation.property.id})}" class="chat-view-listing">
                View listing
            </a>
        </header>

        <div class="chat-messages" id="chatMessages"
             th:attr="data-conversation-id=${conversation.id},
                      data-current-user-id=${currentUserId}">
            <div th:each="m : ${messages}"
                 th:classappend="${m.sender.id == currentUserId} ? 'msg-mine' : 'msg-theirs'"
                 class="msg">
                <div class="msg-bubble" th:attr="data-msg-id=${m.id}">
                    <p class="msg-content" th:text="${m.content}">Message</p>
                    <span class="msg-time"
                          th:text="${#temporals.format(m.sentAt, 'HH:mm')}">00:00</span>
                </div>
            </div>
        </div>

        <form class="chat-input" id="chatForm" th:action="@{'/api/chat/' + ${conversation.id} + '/send'}" method="post">
            <textarea id="chatInput" placeholder="Type your message..." maxlength="2000" rows="1"
                      autocomplete="off"></textarea>
            <button type="submit" id="chatSend">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4 20-7z"/></svg>
            </button>
        </form>
    </div>
</div>

<script th:src="@{/js/chat.js}"></script>
</body>
</html>
