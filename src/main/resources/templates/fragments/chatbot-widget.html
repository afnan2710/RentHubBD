<div th:fragment="chatbot" class="cb-root">

    <button id="cbToggle" class="cb-toggle" type="button" aria-label="Open chat assistant">
        <svg class="cb-icon-chat" viewBox="0 0 24 24" width="26" height="26" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-4-1L3 20l1-4.5A8.5 8.5 0 1 1 21 11.5z"/>
        </svg>
        <svg class="cb-icon-close" viewBox="0 0 24 24" width="24" height="24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18"/><path d="M6 6l12 12"/>
        </svg>
    </button>

    <div id="cbWindow" class="cb-window" aria-hidden="true">
        <div class="cb-header">
            <div class="cb-header-avatar">R</div>
            <div class="cb-header-info">
                <p class="cb-header-title">RentHub Assistant</p>
                <p class="cb-header-sub">Ask about any rental</p>
            </div>
            <button id="cbClose" class="cb-close" type="button" aria-label="Close">&#10005;</button>
        </div>

        <div id="cbMessages" class="cb-messages">
            <div class="cb-msg cb-msg-bot">
                <div class="cb-bubble">
                    Hi! Tell me what you're looking for.
                    Try: <em>"I need a 3-bedroom flat in Dhanmondi under 40000"</em>
                </div>
            </div>
        </div>

        <form id="cbForm" class="cb-input-row" autocomplete="off">
            <input id="cbInput" type="text" placeholder="Type your message..." maxlength="400">
            <button type="submit" class="cb-send" aria-label="Send">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4 20-7z"/>
                </svg>
            </button>
        </form>
    </div>
</div>
