<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews - RentHubBD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/listing.css}">
    <link rel="stylesheet" th:href="@{/css/explore.css}">
</head>
<body>
<div class="dashboard-layout">
    <div th:replace="~{fragments/owner-sidebar :: sidebar('reviews')}"></div>
    <main class="dashboard-main">

        <div class="dashboard-topbar">
            <h1>Reviews</h1>
            <p class="subtitle">What renters are saying about your properties.</p>
        </div>

        <div class="stat-grid">
            <div class="stat-card">
                <p class="stat-label">Total Reviews</p>
                <p class="stat-value" th:text="${totalReviews}">0</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Average Rating</p>
                <p class="stat-value"
                   th:text="${totalReviews > 0 ? #numbers.formatDecimal(averageRating, 1, 1) : '—'}">—</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">5-star</p>
                <p class="stat-value"
                   th:text="${#lists.size(reviews.?[rating == 5])}">0</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Low rated</p>
                <p class="stat-value"
                   th:text="${#lists.size(reviews.?[rating <= 2])}">0</p>
            </div>
        </div>

        <div th:if="${reviews.isEmpty()}" class="panel">
            <h3>No reviews yet</h3>
            <p>Reviews from renters will appear here once they review your listings.</p>
        </div>

        <div th:if="${!reviews.isEmpty()}" class="review-list">
            <article class="review-item" th:each="r : ${reviews}">
                <div class="review-avatar"
                     th:text="${#strings.substring(r.reviewer.firstName, 0, 1).toUpperCase()}">U</div>
                <div class="review-body">
                    <div class="review-head">
                        <div>
                            <p class="review-author"
                               th:text="${r.reviewer.firstName + ' ' + r.reviewer.lastName}">Name</p>
                            <p class="review-date">
                                on <a th:href="@{/listing/{id}(id=${r.property.id})}" class="btn-link"
                                      th:text="${r.property.title}">Property</a>
                                &middot;
                                <span th:text="${#temporals.format(r.createdAt, 'dd MMM yyyy')}">date</span>
                            </p>
                        </div>
                        <div class="review-stars">
                            <span th:each="i : ${#numbers.sequence(1, 5)}"
                                  th:classappend="${i <= r.rating} ? 'filled' : ''">&#9733;</span>
                        </div>
                    </div>
                    <h4 class="review-title" th:if="${r.title != null}" th:text="${r.title}">Title</h4>
                    <p class="review-text" th:if="${r.comment != null}" th:text="${r.comment}">Comment</p>
                </div>
            </article>
        </div>

    </main>
</div>
</body>
</html>
