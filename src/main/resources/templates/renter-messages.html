<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - RentHubBD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/listing.css}">
    <link rel="stylesheet" th:href="@{/css/messages.css}">
</head>
<body>
<div class="dashboard-layout">
    <div th:replace="~{fragments/renter-sidebar :: sidebar('messages')}"></div>
    <main class="dashboard-main">

        <div class="dashboard-topbar">
            <h1>Messages</h1>
            <p class="subtitle">Chat directly with property owners.</p>
        </div>

        <div th:if="${conversations.isEmpty()}" class="panel">
            <h3>No conversations yet</h3>
            <p>Open any listing and click <strong>Message owner</strong> to start chatting.</p>
        </div>

        <div th:if="${!conversations.isEmpty()}" class="conv-list">
            <a th:each="c : ${conversations}"
               th:href="@{/chat/{id}(id=${c.id})}"
               class="conv-item">
                <div class="conv-avatar"
                     th:text="${#strings.substring(c.owner.firstName, 0, 1).toUpperCase()}">O</div>
                <div class="conv-body">
                    <p class="conv-name"
                       th:text="${c.owner.firstName + ' ' + c.owner.lastName}">Owner</p>
                    <p class="conv-property" th:text="${c.property.title}">Property</p>
                </div>
                <div class="conv-right">
                    <span class="conv-time"
                          th:text="${c.lastMessageAt != null ? #temporals.format(c.lastMessageAt, 'dd MMM HH:mm') : ''}">time</span>
                    <span class="conv-badge"
                          th:if="${unreadMap != null and unreadMap.containsKey(c.id)}"
                          th:text="${unreadMap.get(c.id)}">0</span>
                </div>
            </a>
        </div>

    </main>
</div>
</body>
</html>
