    <div class="card">
        <div class="card-header">
            <p class="eyebrow">RentHub BD</p>
            <h1>Create your account</h1>
            <p class="subtitle">Find a place to rent, or list one you own. Takes about two minutes.</p>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form th:action="@{/register}" method="post" enctype="multipart/form-data" id="registerForm" novalidate>

            <div class="field-group">
                <label class="section-label">I am here to</label>
                <div class="role-select">
                    <label class="role-card">
                        <input type="radio" name="userType" value="RENTER" checked>
                        <span class="role-title">Find a place</span>
                        <span class="role-desc">I'm looking for a room, apartment or space to rent</span>
                    </label>
                    <label class="role-card">
                        <input type="radio" name="userType" value="OWNER">
                        <span class="role-title">List my property</span>
                        <span class="role-desc">I own a space and want to rent it out</span>
                    </label>
                </div>
            </div>

            <div class="photo-row">
                <div class="photo-preview" id="photoPreview">
                    <span id="photoInitials">+</span>
                </div>
                <div>
                    <label class="upload-btn" for="profilePhoto">Add profile photo</label>
                    <input type="file" id="profilePhoto" name="profilePhoto" accept="image/*">
                    <p class="hint">Optional. JPG or PNG, up to 5MB.</p>
                </div>
            </div>

            <div class="row-2">
                <div class="field">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="field">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="field">
                <label for="phoneNumber">Phone number</label>
                <div class="phone-row">
                    <select name="countryCode" id="countryCode">
                        <option value="+880" selected>Bangladesh (+880)</option>
                        <option value="+91">India (+91)</option>
                        <option value="+92">Pakistan (+92)</option>
                        <option value="+94">Sri Lanka (+94)</option>
                        <option value="+971">UAE (+971)</option>
                        <option value="+966">Saudi Arabia (+966)</option>
                        <option value="+65">Singapore (+65)</option>
                        <option value="+60">Malaysia (+60)</option>
                        <option value="+44">United Kingdom (+44)</option>
                        <option value="+1">United States (+1)</option>
                        <option value="+61">Australia (+61)</option>
                        <option value="+49">Germany (+49)</option>
                    </select>
                    <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="1XXXXXXXXX" required>
                </div>
            </div>

            <div class="field">
                <label for="dob">Date of birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="field">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="3" required></textarea>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <div class="strength-bar">
                    <span id="strengthSeg1"></span>
                    <span id="strengthSeg2"></span>
                    <span id="strengthSeg3"></span>
                    <span id="strengthSeg4"></span>
                </div>
                <p class="hint" id="strengthLabel">Use 8+ characters with a mix of letters, numbers and symbols</p>
            </div>

            <div class="field">
                <label for="confirmPassword">Retype password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
                <p class="hint" id="matchLabel"></p>
            </div>

            <button type="submit" class="submit-btn">Create account</button>

            <p class="login-link">Already have an account? <a th:href="@{/login}">Login</a></p>

        </form>
    </div>
</div>
<script th:src="@{/js/register.js}"></script>

</html>
