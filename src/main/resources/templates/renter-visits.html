<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Visits - RentHubBD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/listing.css}">
    <link rel="stylesheet" th:href="@{/css/explore.css}">
</head>
<body>
<div class="dashboard-layout">
    <div th:replace="~{fragments/renter-sidebar :: sidebar('visits')}"></div>
    <main class="dashboard-main">

        <div class="dashboard-topbar">
            <h1>My visit requests</h1>
            <p class="subtitle">Track every visit you have requested and its status.</p>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

        <div class="stat-grid">
            <div class="stat-card">
                <p class="stat-label">Pending</p>
                <p class="stat-value"
                   th:text="${summary.get(T(com.aoop.renthubbd.model.VisitStatus).PENDING) ?: 0}">0</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Accepted</p>
                <p class="stat-value"
                   th:text="${summary.get(T(com.aoop.renthubbd.model.VisitStatus).ACCEPTED) ?: 0}">0</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Rescheduled</p>
                <p class="stat-value"
                   th:text="${summary.get(T(com.aoop.renthubbd.model.VisitStatus).RESCHEDULED) ?: 0}">0</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Total</p>
                <p class="stat-value" th:text="${visits.size()}">0</p>
            </div>
        </div>

        <div th:if="${visits.isEmpty()}" class="panel">
            <h3>No visit requests yet</h3>
            <p>Head to the <a th:href="@{/explore}" class="btn-link">Explore page</a> to find a space and request a visit.</p>
        </div>

        <div th:if="${!visits.isEmpty()}" class="visit-cards">
            <article th:each="v : ${visits}" class="visit-card">
                <div class="visit-card-head">
                    <div>
                        <a th:href="@{/listing/{id}(id=${v.property.id})}"
                           class="visit-property" th:text="${v.property.title}">Property</a>
                        <p class="visit-location" th:text="${v.property.area + ', ' + v.property.city}">Location</p>
                    </div>
                    <span class="status"
                          th:classappend="'status-' + ${#strings.toLowerCase(v.status.name())}"
                          th:text="${v.status.label}">Status</span>
                </div>

                <div class="visit-details">
                    <div class="visit-detail">
                        <span class="visit-label">Requested</span>
                        <span th:text="${#temporals.format(v.requestedDate, 'dd MMM yyyy')} + ' · ' + ${v.requestedTime}">—</span>
                    </div>

                    <div class="visit-detail" th:if="${v.status.name() == 'RESCHEDULED'}">
                        <span class="visit-label">Owner proposed</span>
                        <span class="visit-proposed"
                              th:text="${#temporals.format(v.proposedDate, 'dd MMM yyyy')} + ' · ' + ${v.proposedTime}">—</span>
                    </div>

                    <div class="visit-detail" th:if="${v.ownerNote != null}">
                        <span class="visit-label">Owner note</span>
                        <span th:text="${v.ownerNote}">—</span>
                    </div>
                </div>

                <div class="visit-actions">
                    <form th:if="${v.status.name() == 'RESCHEDULED'}"
                          th:action="@{/renter/visits/{id}/confirm(id=${v.id})}" method="post">
                        <button type="submit" class="btn-small btn-approve">Confirm new time</button>
                    </form>

                    <a th:href="@{/chat/start/{propertyId}(propertyId=${v.property.id})}" th:if="false"></a>

                    <form th:action="@{/renter/visits/{id}/cancel(id=${v.id})}" method="post"
                          th:if="${v.status.name() != 'CANCELLED' and v.status.name() != 'COMPLETED'}">
                        <button type="submit" class="btn-small btn-reject"
                                onclick="return confirm('Cancel this visit request?');">Cancel</button>
                    </form>

                    <a th:href="@{/listing/{id}(id=${v.property.id})}" class="btn-small">View listing</a>
                </div>
            </article>
        </div>

    </main>
</div>
</body>
</html>
